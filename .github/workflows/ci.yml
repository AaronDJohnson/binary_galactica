name: CI

# Fast tier on every push and pull request. Validation tests (marked `slow`)
# run in full.yml on main, nightly, and before each PyPI upload.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", dependencies: minimum, os: ubuntu-latest}
          - {python: "3.11", dependencies: current, os: ubuntu-latest}
          - {python: "3.12", dependencies: current, os: ubuntu-latest}
          - {python: "3.13", dependencies: current, os: ubuntu-latest}
          - {python: "3.14", dependencies: current, os: ubuntu-latest}
          - {python: "3.12", dependencies: current, os: macos-latest}
    env:
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/minimum.txt
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -c requirements/minimum.txt -e '.[dev]'
      - name: Install current dependencies
        if: matrix.dependencies == 'current'
        run: python -m pip install -e '.[dev]'
      - name: Report resolved versions
        run: python -m pip list
      - name: Fast tests and doctests
        run: python -m pytest -q -m "not slow" -n auto

  distribution:
    name: Lint, build, and installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and development tools
        run: python -m pip install '.[dev]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - name: Check public API typing
        run: MYPYPATH=src mypy --follow-imports=silent examples/typing_contract.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl pytest pytest-xdist
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -q -m "not slow" -n auto
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
