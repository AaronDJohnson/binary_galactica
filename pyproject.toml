[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-galactica"
version = "0.2.0"
description = "Differentiable GLASS fast-slow LISA galactic-binary TDI waveforms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*", "NOTICE", "tools/glass_reference/vendor/kissfft/COPYING", "tools/glass_reference/vendor/kissfft/LICENSES/*"]
authors = [{ name = "Aaron" }]
keywords = ["gravitational-waves", "LISA", "galactic-binaries", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jax>=0.4.30", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/binary_galactica"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"src/binary_galactica/glass/*" = ["N802", "N803", "N806"]
"tests/glass/*" = ["N802", "N803", "N806"]
"src/binary_galactica/detector.py" = ["N803"]
