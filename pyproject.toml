[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-galactica"
version = "0.1.0"
description = "Differentiable gravitational waveform model for LISA galactic binaries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron" }]
keywords = ["gravitational-waves", "LISA", "galactic-binaries", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jax>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/binary_galactica"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
