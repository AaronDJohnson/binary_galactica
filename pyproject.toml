[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-galactica"
version = "0.5.0"
description = "Differentiable LISA galactic-binary TDI waveforms in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "tools/glass_reference/LICENSE-GLASS", "tools/glass_reference/vendor/kissfft/COPYING", "tools/glass_reference/vendor/kissfft/LICENSES/*"]
authors = [
    { name = "Aaron D. Johnson", email = "aaron9035@gmail.com" },
    { name = "Tyson B. Littenberg" },
    { name = "Neil J. Cornish" },
    { name = "Robert Rosati" },
]
keywords = ["gravitational-waves", "LISA", "galactic-binaries", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jax>=0.6.0", "numpy>=1.25"]

[project.urls]
Source = "https://github.com/AaronDJohnson/binary_galactica"
Documentation = "https://github.com/AaronDJohnson/binary_galactica#readme"
Issues = "https://github.com/AaronDJohnson/binary_galactica/issues"
GLASS = "https://github.com/nsgs-analysis-center/glass"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.0", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/binary_galactica"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"src/binary_galactica/glass/*" = ["N802", "N803", "N806"]
"tests/glass/*" = ["N802", "N803", "N806"]
"src/binary_galactica/detector.py" = ["N803"]
"src/binary_galactica/single.py" = ["N803"]
